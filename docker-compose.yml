services:
  ddns-monitor:
    build: .
    container_name: ddns-monitor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8300:8300"
    environment:
      TZ: Asia/Shanghai
      # 生产环境保持 true 并由反代提供 HTTPS；仅内网 HTTP 调试时显式关闭。
      COOKIE_SECURE: "${COOKIE_SECURE-true}"
      # 这些地址被视为可信反向代理：来自它们的 X-Forwarded-For 才会被采信用于登录限速。
      # 端口只发布到 127.0.0.1，通常由宿主机上的 nginx/caddy 反代；Docker 桥接网段
      # （172.16.0.0/12）已覆盖默认情况。直接暴露到公网时应改为空值或仅保留回环地址。
      # 用 ${VAR-default} 而非 ${VAR:-default}：空值才是"关闭 XFF 信任"的方式，
      # :- 会把空值当成未设置、仍然套用默认值
      TRUSTED_PROXIES: "${TRUSTED_PROXIES-172.16.0.0/12}"
      # X-Forwarded-For 中由可信代理追加的层数，默认 1（单层反代）。
      # 经 CDN + 反代两层时设为 2，否则限速会把代理 IP 当成客户端。
      TRUSTED_PROXY_HOPS: "${TRUSTED_PROXY_HOPS-1}"
      # 如服务器在国内无法直连 Telegram API，取消注释并填入代理地址:
      # TG_PROXY: "socks5://192.168.1.1:1080"
    volumes:
      - ./data:/app/data
