{% macro error_summary(id, title, errors) -%}
{% if errors %}
<div class="alert error error-summary" id="{{ id }}" role="alert" tabindex="-1"
     data-error-summary aria-labelledby="{{ id }}-heading">
  <strong id="{{ id }}-heading">{{ title }}</strong>
  <ul>{% for field, message in errors.items() %}<li><a href="#{{ field }}">{{ message }}</a></li>{% endfor %}</ul>
</div>
{% endif %}
{%- endmacro %}
